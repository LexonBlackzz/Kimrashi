[package]
name = "kimrashi"
version = "0.5.0"
edition = "2021"
default-run = "kimrashi"
description = "A MIDI player that keeps the whole song packed in memory, with a GPU-rendered piano roll"
license = "GPL-3.0-or-later"

[[bin]]
name = "kimrashi-sign"
path = "tools/sign.rs"

[dependencies]
libloading = "0.8.9"
crossbeam-channel = "0.5.15"
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui = "0.32.3"
rfd = "0.15.4"
rayon = "1.11.0"
egui-wgpu = "0.32.3"
bytemuck = { version = "1.17", features = ["derive"] }
# Compressed MIDI loading
zip = { version = "9", default-features = false, features = ["deflate", "deflate64"] }
sevenz-rust2 = { version = "0.23", features = ["zstd"] }
lzma-rust2 = "0.21"
# C liblzma for xz layers: ~3.5x faster than lzma-rust2 on streams of long matches (bomb-like files)
liblzma = { version = "0.4", features = ["static"] }
memchr = "2"
flate2 = "1"
unrar = "0.5"
zstd = { version = "0.13", default-features = false }
tar = { version = "0.4", default-features = false }
# Palette images
png = { version = "0.18", default-features = false }
# Update check and self-update from GitHub releases
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Release signatures: the updater verifies, tools/sign.rs signs
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["timeapi", "dwmapi", "dxgi", "winerror", "mmeapi", "mmsystem", "sysinfoapi", "processthreadsapi", "winbase"] }

[profile.release]
# No whole-program LTO or single codegen unit: neither measurably changed load or
# playback speed here, and they made every build take ~100 s instead of seconds.
lto = false
codegen-units = 16
incremental = true
panic = "abort"
